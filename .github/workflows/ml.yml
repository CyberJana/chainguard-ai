name: ML pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt pytest
      - run: python -m pytest -q ml/tests
      - run: python -m pip install pip-audit
      - run: pip-audit -r ml/requirements.txt
